<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif;}

        body{
            background-color: #5c4033;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .tv-container{
            display: flex;
            width: 95vw;
            height: 90vh;
            gap: 10px;
        }
        .left-painel{
            display: flex;
            flex-direction: column;
            width: 35%;
            gap: 18px;
        }

        .right-painel{
            display: flex;
            flex-direction: column;
            width: 65%;
            gap: 18px;
        }

        .box{
            background-color: #63d4f4;
            border: 6px solid #b39b82;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .box-title{
            color: #ffffff;
            font-size: 2.2vw;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
            margin-bottom: 12px;
        }

        /* Painel esquerdo - local (guichê ou consutório) */
        .local-box{flex: 1;}
        .local-number{
            color: #d12c2c;
            font-size: 9vw;
            font-weight: bold;
            line-height: 1;
        }
      




    </style>
    <title>Document</title>
</head>
<body>
</body>
</html>
