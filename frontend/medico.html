<html>
<head>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <h2>🩺 Painel Médico</h2>

  <div id="triagens"></div>

  <hr>

  <h3>Consulta</h3>

  <input id="paciente" placeholder="Paciente" readonly>

  <input id="diagnostico" placeholder="Diagnóstico">

  <select id="medicacao">
    <option value="">Selecione a medicação</option>
  </select>

  <textarea id="obs" placeholder="Observações"></textarea>

  <button onclick="salvar()">Salvar</button>

</div>

<script>

let triagensCarregadas = [];

function carregar() {
  fetch("/triagens")
    .then(r => r.json())
    .then(data => {

      triagensCarregadas = data;

      const div = document.getElementById("triagens");

      div.innerHTML = "";

      data.forEach((t, index) => {

        div.innerHTML += `
          <div class="card">

            <h3>${t.nome}</h3>

            <p>
              <b>Sintoma:</b>
              ${t.sintoma || t.sintomas || "Não informado"}
            </p>

            <p>
              <b>Temperatura:</b>
              ${t.temperatura || t.temp || "Não informada"}°C
            </p>

            <p>
              <span class="${t.risco}">
                ${t.risco}
              </span>
            </p>

            <p>
              <b>Alergia:</b>
              ${t.alergia || "Nenhuma"}
            </p>

            <p>
              <b>Observação:</b>
              ${t.observacao || "Nenhuma"}
            </p>

            <button type="button" onclick="selecionar(${index})">
              Atender
            </button>

            <button type="button" onclick="darAlta(${index})">
              Dar alta
            </button>

          </div>
        `;
      });
    })
    .catch(error => {
      console.error("Erro ao carregar triagens:", error);
      alert("Erro ao carregar os pacientes.");
    });
}


function selecionar(index) {

  const t = triagensCarregadas[index];

  if (!t) {
    alert("Paciente não encontrado.");
    return;
  }

  // Coloca o nome do paciente na consulta
  document.getElementById("paciente").value = t.nome || "";

  // Coloca a observação da triagem na consulta
  document.getElementById("obs").value =
    t.observacao || "";

  // Mostra alerta se o paciente tiver alergia
  if (t.alergia && t.alergia !== "Nenhuma") {
    alert("⚠️ Paciente possui alergia: " + t.alergia);
  }

  // Depois de clicar em OK, vai para a área de consulta
  document.getElementById("paciente").scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}


function darAlta(index) {

  const t = triagensCarregadas[index];

  if (!t) {
    alert("Paciente não encontrado.");
    return;
  }

  if (!confirm("Deseja dar alta para " + t.nome + "?")) {
    return;
  }

  fetch("/alta", {
    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      paciente: t.nome
    })
  })
  .then(r => r.json())
  .then(data => {

    if (data.erro) {
      alert("❌ " + data.erro);
      return;
    }

    alert("✅ Paciente recebeu alta!");

    document.getElementById("paciente").value = "";
    document.getElementById("diagnostico").value = "";
    document.getElementById("medicacao").value = "";
    document.getElementById("obs").value = "";

    carregar();

  })
  .catch(error => {

    console.error("Erro ao dar alta:", error);

    alert("❌ Erro ao dar alta.");

  });
}


function carregarMedicacoes() {

  fetch("/lista-medicacoes")

    .then(r => r.json())

    .then(data => {

      const select =
        document.getElementById("medicacao");

      select.innerHTML = `
        <option value="">Selecione a medicação</option>
      `;

      data.forEach(med => {

        const option =
          document.createElement("option");

        option.value = med;

        option.textContent = med;

        select.appendChild(option);

      });

    })

    .catch(error => {

      console.error(
        "Erro ao carregar medicações:",
        error
      );

    });
}


function salvar() {

  const paciente =
    document.getElementById("paciente").value;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;

  const obs =
    document.getElementById("obs").value;


  if (!paciente) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;

  }


  if (!medicacao) {

    alert(
      "Selecione uma medicação."
    );

    return;

  }


  fetch("/consulta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      paciente,
      diagnostico,
      medicacao,
      obs

    })

  })

  .then(r => r.json())

  .then(() => {

    alert("Consulta salva");

    document.getElementById(
      "diagnostico"
    ).value = "";

    document.getElementById(
      "medicacao"
    ).value = "";

    document.getElementById(
      "obs"
    ).value = "";

  })

  .catch(error => {

    console.error(
      "Erro ao salvar consulta:",
      error
    );

    alert("Erro ao salvar consulta.");

  });

}


carregar();

carregarMedicacoes();

</script>

</body>
