<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <title>Painel Médico</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <h2>🩺 Painel Médico</h2>

  <div id="triagens"></div>

  <hr>

  <h3>Consulta</h3>

  <input
    id="paciente"
    placeholder="Paciente"
    readonly
  >

  <input
    id="diagnostico"
    placeholder="Diagnóstico"
  >

  <select id="medicacao">

    <option value="">
      Selecione a medicação
    </option>

  </select>

  <textarea
    id="obs"
    placeholder="Observações"
  ></textarea>

  <button
    type="button"
    onclick="salvar()"
  >
    Salvar Consulta
  </button>

</div>


<script>

let triagensCarregadas = [];


// =====================================================
// CARREGAR PACIENTES
// =====================================================

function carregar() {

  fetch("/triagens")

    .then(response => {

      if (!response.ok) {
        throw new Error("Erro ao buscar triagens.");
      }

      return response.json();

    })

    .then(data => {

      triagensCarregadas = data;

      const div =
        document.getElementById("triagens");

      div.innerHTML = "";


      // Nenhum paciente
      if (data.length === 0) {

        div.innerHTML = `
          <p>
            Nenhum paciente aguardando atendimento.
          </p>
        `;

        return;
      }


      // Criar cards
      data.forEach((t, index) => {

        div.innerHTML += `

          <div class="card">

            <h3>
              ${t.nome || "Paciente"}
            </h3>


            <p>
              <b>Sintoma:</b>
              ${t.sintoma || t.sintomas || "Não informado"}
            </p>


            <p>
              <b>Temperatura:</b>
              ${t.temperatura || t.temp || "Não informada"}°C
            </p>


            <p>

              <b>Risco:</b>

              <span class="${t.risco || ""}">
                ${t.risco || "Não informado"}
              </span>

            </p>


            <p>
              <b>Alergia:</b>
              ${t.alergia || "Nenhuma"}
            </p>


            <p>
              <b>Observação:</b>
              ${t.observacao || "Nenhuma"}
            </p>


            <div class="botoes">

              <button
                type="button"
                onclick="selecionar(${index})"
              >
                🩺 Atender
              </button>


              <button
                type="button"
                onclick="darAlta(${index})"
              >
                ✅ Dar Alta
              </button>

            </div>

          </div>

        `;

      });

    })

    .catch(error => {

      console.error(
        "Erro ao carregar triagens:",
        error
      );

      alert(
        "❌ Erro ao carregar os pacientes."
      );

    });

}



// =====================================================
// SELECIONAR PACIENTE
// =====================================================

function selecionar(index) {

  const t =
    triagensCarregadas[index];


  if (!t) {

    alert(
      "Paciente não encontrado."
    );

    return;
  }


  // Nome
  document.getElementById(
    "paciente"
  ).value = t.nome || "";


  // Observação da triagem
  document.getElementById(
    "obs"
  ).value = t.observacao || "";


  // Alerta de alergia
  if (
    t.alergia &&
    t.alergia !== "Nenhuma"
  ) {

    alert(
      "⚠️ Paciente possui alergia: " +
      t.alergia
    );

  }


  // Ir para consulta
  document.getElementById(
    "paciente"
  ).scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}



// =====================================================
// DAR ALTA + GERAR PDF
// =====================================================

function darAlta(index) {

  const t =
    triagensCarregadas[index];


  if (!t) {

    alert(
      "Paciente não encontrado."
    );

    return;
  }


  const confirmar = confirm(
    "Deseja realmente dar alta para " +
    t.nome +
    "?\n\n" +
    "Um formulário de alta será gerado em PDF."
  );


  if (!confirmar) {
    return;
  }


  // Desabilita o botão durante o processo
  const botoes =
    document.querySelectorAll(
      ".card button"
    );

  botoes.forEach(botao => {
    botao.disabled = true;
  });


  fetch("/alta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      paciente: t.nome

    })

  })


  .then(async response => {

    // Se o backend retornar erro
    if (!response.ok) {

      let mensagem =
        "Erro ao dar alta.";

      try {

        const erro =
          await response.json();

        mensagem =
          erro.erro || mensagem;

      } catch (e) {}

      throw new Error(
        mensagem
      );
    }


    // O backend retorna o PDF
    return response.blob();

  })


  .then(blob => {

    // Cria URL temporária do PDF
    const url =
      window.URL.createObjectURL(blob);


    // Cria link para download
    const link =
      document.createElement("a");


    link.href = url;


    // Nome do arquivo
    link.download =
      "Formulario_Alta_" +
      t.nome
        .replace(/[^a-zA-Z0-9À-ÿ ]/g, "")
        .replace(/\s+/g, "_") +
      ".pdf";


    document.body.appendChild(link);


    // Inicia download
    link.click();


    // Remove link
    link.remove();


    // Libera memória
    window.URL.revokeObjectURL(url);


    // Limpar formulário
    limparConsulta();


    // Atualizar lista
    carregar();


    alert(
      "✅ Alta realizada com sucesso!\n\n" +
      "O formulário de alta foi gerado em PDF."
    );

  })


  .catch(error => {

    console.error(
      "Erro ao dar alta:",
      error
    );


    alert(
      "❌ " + error.message
    );

  })


  .finally(() => {

    // Reativar botões
    botoes.forEach(botao => {
      botao.disabled = false;
    });

  });

}



// =====================================================
// LIMPAR CONSULTA
// =====================================================

function limparConsulta() {

  document.getElementById(
    "paciente"
  ).value = "";


  document.getElementById(
    "diagnostico"
  ).value = "";


  document.getElementById(
    "medicacao"
  ).value = "";


  document.getElementById(
    "obs"
  ).value = "";

}



// =====================================================
// CARREGAR MEDICAÇÕES
// =====================================================

function carregarMedicacoes() {

  fetch("/lista-medicacoes")

    .then(response => {

      if (!response.ok) {
        throw new Error(
          "Erro ao carregar medicações."
        );
      }

      return response.json();

    })

    .then(data => {

      const select =
        document.getElementById(
          "medicacao"
        );


      select.innerHTML = `

        <option value="">
          Selecione a medicação
        </option>

      `;


      data.forEach(med => {

        const option =
          document.createElement(
            "option"
          );


        option.value = med;

        option.textContent = med;


        select.appendChild(
          option
        );

      });

    })

    .catch(error => {

      console.error(
        "Erro ao carregar medicações:",
        error
      );

    });

}



// =====================================================
// SALVAR CONSULTA
// =====================================================

function salvar() {

  const paciente =
    document.getElementById(
      "paciente"
    ).value;


  const diagnostico =
    document.getElementById(
      "diagnostico"
    ).value;


  const medicacao =
    document.getElementById(
      "medicacao"
    ).value;


  const obs =
    document.getElementById(
      "obs"
    ).value;



  // Validar paciente
  if (!paciente) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;
  }


  // Validar medicação
  if (!medicacao) {

    alert(
      "Selecione uma medicação."
    );

    return;
  }


  fetch("/consulta", {

    method: "POST",

    headers: {

      "Content-Type":
        "application/json"

    },

    body: JSON.stringify({

      paciente,
      diagnostico,
      medicacao,
      obs

    })

  })


  .then(async response => {

    if (!response.ok) {

      let erro =
        "Erro ao salvar consulta.";

      try {

        const data =
          await response.json();

        erro =
          data.erro || erro;

      } catch (e) {}

      throw new Error(erro);
    }


    return response.json();

  })


  .then(() => {

    alert(
      "✅ Consulta salva com sucesso!"
    );


    // Limpa somente os dados da consulta
    document.getElementById(
      "diagnostico"
    ).value = "";


    document.getElementById(
      "medicacao"
    ).value = "";


    // Mantém o paciente selecionado
    // e mantém a observação da triagem

  })


  .catch(error => {

    console.error(
      "Erro ao salvar consulta:",
      error
    );


    alert(
      "❌ " + error.message
    );

  });

}



// =====================================================
// INICIAR SISTEMA
// =====================================================

carregar();

carregarMedicacoes();

</script>

</body>

</html>
