<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <a href="index.html" style="text-decoration: none;
        color:#3498db;
        font-size:14px; display:inline-block;
        margin-bottom:12px;"> Voltar para login</a>

        <h2>Cadastrar Usuário</h2>

        <form id="formUsuario">
            <input type="text" id="usuario" placeholder="Nome de usuario (login)" required>
            <input type="password" id="senha" placeholder="Senha" required>

            <select id="tipo" required>
                <option value="">Selecione Setor</option>
                <option value="atendimento">Atendimento</option>
                <option value="triagem">Triagem</option>
                <option value="medico">Médico</option>
            </select>

            <button type="submit">Cadastrar Usuário</button>
        </form>

        <hr style="margin: 25px 0; border: none; border-top: 1px solid #ccc;">

        <h3>Usuários Cadastrados</h3>
        <div id="ListarUsuarios"></div>
    </div>

    <script>
        // 1, Cadastrar usuário ao enviar o formulário
        document.getElementById('formUsuario').addEventListener('submit', function(e) {
            e.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            const tipo = document.getElementById('tipo').value;

           fetch("/usuarios",{
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ usuario, senha, tipo })
            })
            .then(res => res.json())
            .then(dados => {
                if (dados.erro) {
                    alert( "Erro:" + dados.erro);
                } else {
                    alert("Usuário cadastrado com sucesso!");
                    document.getElementById('formUsuario').reset();
                    carregarUsuarios();
                }
            });
        });
         // 2, Carregar e listar usuários cadastrados
        function carregarUsuarios() {
            fetch("/usuarios")
            .then(res => res.json())
            .then(usuarios => {
                const div = document.getElementById("ListarUsuarios");
                div.innerHTML = "";

                usuarios.forEach(u => {
                    div.innerHTML += `<div class= "card">
                        <b> Usuário: </b> ${u.usuario} |
                        <b> Setor: </b> ${u.tipo}
                         </div>`
                         ;

                });
            }); 
        }

        // Carrega a lista automaticamente ao abrir a página
        carregarUsuarios();
          
    </script>
</body>
</html>
